<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat robot chassis · STEP inspection</title>
<style>
body{margin:0;font:14px/1.65 var(--font-sans,system-ui,sans-serif);color:var(--foreground,#242629)}
*{box-sizing:border-box}
.metrics{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.metrics strong{font-size:20px;font-weight:650;display:block}
.muted{color:var(--muted-foreground,#687078);font-size:12px}
.stage{position:relative;background:var(--card,#f1f3f5);border-radius:var(--radius,10px);overflow:hidden}
canvas{display:block;width:100%;height:390px;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;bottom:8px;left:12px;pointer-events:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button{font:inherit;font-size:12px;background:var(--secondary,#eee);color:var(--secondary-foreground,#222);border:1px solid var(--border,#ccc);border-radius:6px;padding:4px 12px;cursor:pointer}
button.active{outline:2px solid var(--ring,#4176a6)}
label{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-right:12px}
.chip{display:inline-block;width:10px;height:10px;border-radius:2px}
.note{margin:10px 0 0;font-size:12px}
.dimensions{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="metrics">
  <div><span class="muted">設計外形 · X × Y × Z</span><strong class="dimensions" id="dimensions"></strong></div>
  <div><span class="muted">STEP の部品</span><strong id="count"></strong></div>
  <div><span class="muted">重量・車輪の取り付け</span><strong style="font-size:16px">実測・確認待ち</strong></div>
</div>
<div class="stage"><canvas id="view" aria-label="ドラッグで回転する筐体の3Dモデル"></canvas><div class="hint muted">ドラッグで回転 · ホイールで拡大</div></div>
<div class="controls">
  <button data-view="oblique" class="active">斜め</button><button data-view="top">XY 上面</button><button data-view="side">XZ 側面</button><button data-view="other">YZ 側面</button>
</div>
<div id="parts"></div>
<p class="note" id="frame-note">元の CAD 座標で表示。+X / +Y はロボットの前後左右を確定した表示ではありません。形状と寸法は設計値であり、印刷後の寸法・組立誤差・重心は実測で確認します。</p>
<script type="module">
const compressed = Uint8Array.from(atob('__CAD_DATA__'), c=>c.charCodeAt(0));
const data = await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const bounds = data.manifest.bounds_m;
const center = bounds[0].map((v,i)=>(v+bounds[1][i])/2);
const extent = Math.max(...data.manifest.dimensions_m);
let azimuth = -0.65, elevation = 0.52, zoom = 1, width = 728;
let drag = null;
const height = 390;
const visibility = data.parts.map(()=>true);
document.getElementById('dimensions').textContent = data.manifest.dimensions_m.map(v=>Number((v*1000).toFixed(2))).join(' × ') + ' mm';
document.getElementById('count').textContent = data.parts.length + ' ソリッド';
if(data.frame){
  const status=data.frame.alignment==='assumed'?'設定上の仮の向き':'確認済みの向き';
  document.getElementById('frame-note').textContent=`${status}：前方 CAD ${data.frame.forward}、左 CAD ${data.frame.left}、上 CAD ${data.frame.up}。元の CAD 座標で表示しています。車輪の寸法・取り付け高さ・重量・接触条件は実測で確認します。`;
}
const colors = [];
const colorProbe = document.createElement('canvas').getContext('2d', {willReadFrequently:true});
data.parts.forEach((part,i)=>{
  const label = document.createElement('label');
  const checkbox = document.createElement('input');checkbox.type='checkbox';checkbox.checked=true;
  checkbox.addEventListener('change',()=>{visibility[i]=checkbox.checked;draw()});
  const chip = document.createElement('span');chip.className='chip';
  chip.style.background=`var(--chart-${i+1},${['#c65b43','#d4a043','#377fa3'][i%3]})`;
  label.append(checkbox,chip,document.createTextNode(part.name || `Solid ${i+1}`));
  document.getElementById('parts').append(label);
  colorProbe.fillStyle = getComputedStyle(chip).backgroundColor;
  colorProbe.fillRect(0,0,1,1);colors.push([...colorProbe.getImageData(0,0,1,1).data].slice(0,3));
});
function project(point){
  const [x,y,z] = point.map((v,i)=>v-center[i]);
  const rx=Math.cos(azimuth)*x-Math.sin(azimuth)*y;
  const ry=Math.sin(azimuth)*x+Math.cos(azimuth)*y;
  const vertical=Math.cos(elevation)*z+Math.sin(elevation)*ry;
  const depth=Math.sin(elevation)*z-Math.cos(elevation)*ry;
  const scale=Math.min(width*0.65,height*0.72)/extent*zoom;
  return [width/2+rx*scale,height/2-vertical*scale,depth];
}
function draw(){
  ctx.clearRect(0,0,width,height);
  const faces=[];
  data.parts.forEach((part,i)=>{
    if(!visibility[i])return;
    const points=part.vertices.map(project);
    part.triangles.forEach(indices=>{
      const p=indices.map(j=>part.vertices[j]);
      const a=p[1].map((v,k)=>v-p[0][k]), b=p[2].map((v,k)=>v-p[0][k]);
      const n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
      const norm=Math.hypot(...n);
      if(norm<1e-15)return;
      const shade=0.5+0.5*Math.abs((n[0]*0.2-n[1]*0.4+n[2]*0.9)/(norm*Math.hypot(0.2,0.4,0.9)));
      const vertices=indices.map(j=>points[j]);
      faces.push({vertices,depth:vertices.reduce((s,v)=>s+v[2],0)/3,color:colors[i].map(v=>Math.round(v*shade))});
    });
  });
  faces.sort((a,b)=>a.depth-b.depth);
  faces.forEach(face=>{
    ctx.beginPath();face.vertices.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
    ctx.fillStyle=`rgb(${face.color.join(',')})`;ctx.fill();
  });
  const origin=project([0,0,0]);
  const axisColors=['#db625b','#4c9a70','#628cdb'];
  ['X','Y','Z'].forEach((axis,i)=>{
    const target=[0,0,0];target[i]=extent*0.62;
    const end=project(target);
    if(Math.hypot(end[0]-origin[0],end[1]-origin[1])<8)return;
    ctx.strokeStyle=axisColors[i];ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(origin[0],origin[1]);ctx.lineTo(end[0],end[1]);ctx.stroke();
    const label='+'+axis+(data.frame?.forward==='+'+axis?'（前方）':'');
    ctx.fillStyle=axisColors[i];ctx.font='bold 13px system-ui';ctx.fillText(label,end[0]+4,end[1]-4);
  });
}
new ResizeObserver(()=>{
  width=canvas.clientWidth;
  const ratio=window.devicePixelRatio || 1;
  canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);draw();
}).observe(canvas);
canvas.addEventListener('pointerdown',event=>{drag=[event.clientX,event.clientY];canvas.setPointerCapture(event.pointerId)});
canvas.addEventListener('pointermove',event=>{
  if(!drag)return;
  azimuth+=(event.clientX-drag[0])*0.01;elevation=Math.max(-1.57,Math.min(1.57,elevation+(event.clientY-drag[1])*0.01));
  drag=[event.clientX,event.clientY];document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));draw();
});
canvas.addEventListener('pointerup',()=>{drag=null});canvas.addEventListener('pointercancel',()=>{drag=null});
canvas.addEventListener('wheel',event=>{event.preventDefault();zoom=Math.max(0.5,Math.min(3,zoom*Math.exp(-event.deltaY*0.001)));draw()},{passive:false});
document.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>{
  [azimuth,elevation]={oblique:[-0.65,0.52],top:[0,Math.PI/2],side:[0,0],other:[Math.PI/2,0]}[button.dataset.view];zoom=1;
  document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));draw();
}));
</script>
</body>
</html>
